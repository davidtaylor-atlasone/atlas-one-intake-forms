:root{--navy:#23304D;--peri:#788DE3;--paper:#FAFAF8;--mist:#DBE4ED;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--paper);color:var(--navy);
  font-family:'DM Sans',Arial,sans-serif;}
h1{font-family:'Horas','DM Sans',Arial,sans-serif;}
.wrap{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;}
.logo-row{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.partner-chip{display:flex;align-items:center;gap:8px;background:var(--paper);
  border:1px solid var(--mist);border-radius:999px;padding:6px 16px 6px 14px;}
.partner-chip-label{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--navy);opacity:.55;font-weight:700;}
.chip-logo{height:17px !important;width:auto !important;}
.qr{width:min(72vw,340px);height:min(72vw,340px);border:10px solid var(--paper);
  box-shadow:0 0 0 2px var(--mist);border-radius:20px;}
.name{font-size:1.4rem;margin:0;text-align:center;}
.hint{font-size:.85rem;color:var(--navy);opacity:.65;text-align:center;max-width:280px;}
